services:
  backend-test:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    command: ["go", "test", "-race", "-count=1", "./..."]
    environment:
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-brightest_teeth}:${POSTGRES_PASSWORD:-brightest_teeth}@postgres:5432/${POSTGRES_DB:-brightest_teeth}?sslmode=disable
      TEST_S3_ENDPOINT: http://minio:9000
      TEST_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      TEST_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-brightest_teeth}:${POSTGRES_PASSWORD:-brightest_teeth}@postgres:5432/${POSTGRES_DB:-brightest_teeth}?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-vehicle-photos}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ML_URL: http://ml:8000
      MODEL_VERSION: ${MODEL_VERSION:-reid-resnet50-v1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5

  ml:
    build:
      context: .
      dockerfile: core/Dockerfile
    restart: unless-stopped
    environment:
      MODEL_VERSION: ${MODEL_VERSION:-reid-resnet50-v1}
      MODEL_DEVICE: cpu
      MODEL_WEIGHTS: /app/core/weights/reid_model_final.pth
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: brightest_teeth_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brightest_teeth}
      POSTGRES_USER: ${POSTGRES_USER:-brightest_teeth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brightest_teeth}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: brightest_teeth_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: brightest_teeth_minio_init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-vehicle-photos}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set none "local/$${S3_BUCKET}"

volumes:
  postgres_data:
  minio_data:
